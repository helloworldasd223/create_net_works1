name: Build Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'arena/**'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show produced jars
        if: always()
        run: ls -la build/libs || true

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: createnetworks-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish jar into repository (dist/)
        if: success()
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "dist/ already up to date"
            exit 0
          fi
          git commit -m "Publish built mod jar [skip ci]"
          git push

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Report build log to issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          log_file=build.log
          [ -f "$log_file" ] || log_file=/dev/null
          {
            echo "Auto-captured build log for $RUN_URL (commit $SHA)."
            echo ""
            echo '```'
            tail -c 55000 "$log_file"
            echo '```'
          } > /tmp/body.md
          gh issue create \
            --title "CI build log ($SHA)" \
            --body-file /tmp/body.md \
            --label "" 2>/dev/null || \
          gh issue create --title "CI build log ($SHA)" --body-file /tmp/body.md
